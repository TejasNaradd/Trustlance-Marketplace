server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**
        - id: marketplace-service
          uri: lb://marketplace-service
          predicates:
            - Path=/api/v1/services/**, /api/v1/categories/**
        - id: contract-service
          uri: lb://contract-service
          predicates:
            - Path=/api/v1/contracts/**, /api/v1/milestones/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: escrow-service
          uri: lb://escrow-service
          predicates:
            - Path=/api/v1/escrow/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**
        - id: dispute-service
          uri: lb://dispute-service
          predicates:
            - Path=/api/v1/disputes/**, /api/v1/admin/disputes/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
