server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            allowCredentials: false
            maxAge: 3600
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            # ─── Business API Routes ─────────────────────────────────────────────────
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/admin/users/**

            - id: marketplace-service
              uri: lb://marketplace-service
              predicates:
                - Path=/api/v1/services/**,/api/v1/categories/**

            - id: contract-service
              uri: lb://contract-service
              predicates:
                - Path=/api/v1/contracts/**,/api/v1/milestones/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            - id: escrow-service
              uri: lb://escrow-service
              predicates:
                - Path=/api/v1/escrow/**

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/api/v1/reviews/**

            - id: dispute-service
              uri: lb://dispute-service
              predicates:
                - Path=/api/v1/disputes/**,/api/v1/admin/disputes/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/ai/**

            # ─── Swagger / OpenAPI Doc Routes ────────────────────────────────────────
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/swagger/user-service/**
              filters:
                - RewritePath=/swagger/user-service/(?<segment>.*), /${segment}

            - id: marketplace-service-docs
              uri: lb://marketplace-service
              predicates:
                - Path=/swagger/marketplace-service/**
              filters:
                - RewritePath=/swagger/marketplace-service/(?<segment>.*), /${segment}

            - id: contract-service-docs
              uri: lb://contract-service
              predicates:
                - Path=/swagger/contract-service/**
              filters:
                - RewritePath=/swagger/contract-service/(?<segment>.*), /${segment}

            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/swagger/payment-service/**
              filters:
                - RewritePath=/swagger/payment-service/(?<segment>.*), /${segment}

            - id: escrow-service-docs
              uri: lb://escrow-service
              predicates:
                - Path=/swagger/escrow-service/**
              filters:
                - RewritePath=/swagger/escrow-service/(?<segment>.*), /${segment}

            - id: review-service-docs
              uri: lb://review-service
              predicates:
                - Path=/swagger/review-service/**
              filters:
                - RewritePath=/swagger/review-service/(?<segment>.*), /${segment}

            - id: dispute-service-docs
              uri: lb://dispute-service
              predicates:
                - Path=/swagger/dispute-service/**
              filters:
                - RewritePath=/swagger/dispute-service/(?<segment>.*), /${segment}

            - id: notification-service-docs
              uri: lb://notification-service
              predicates:
                - Path=/swagger/notification-service/**
              filters:
                - RewritePath=/swagger/notification-service/(?<segment>.*), /${segment}

            - id: ai-service-docs
              uri: lb://ai-service
              predicates:
                - Path=/swagger/ai-service/**
              filters:
                - RewritePath=/swagger/ai-service/(?<segment>.*), /${segment}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "1. User Service"
        url: /swagger/user-service/v3/api-docs
      - name: "2. Marketplace Service"
        url: /swagger/marketplace-service/v3/api-docs
      - name: "3. Contract Service"
        url: /swagger/contract-service/v3/api-docs
      - name: "4. Payment Service"
        url: /swagger/payment-service/v3/api-docs
      - name: "5. Escrow Service"
        url: /swagger/escrow-service/v3/api-docs
      - name: "6. Review Service"
        url: /swagger/review-service/v3/api-docs
      - name: "7. Dispute Service"
        url: /swagger/dispute-service/v3/api-docs
      - name: "8. Notification Service"
        url: /swagger/notification-service/v3/api-docs
      - name: "9. AI Service"
        url: /swagger/ai-service/v3/api-docs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

trustlance:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
