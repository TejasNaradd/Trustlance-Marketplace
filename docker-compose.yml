version: "3.9"

networks:
  trustlance-network:
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  minio-data:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rcoem
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trustlance-network

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - trustlance-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - trustlance-network

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - trustlance-network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - trustlance-network

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: trustlance-config-server:latest
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - trustlance-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: trustlance-eureka-server:latest
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    networks:
      - trustlance-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: trustlance-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - eureka-server
      - redis
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - trustlance-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: trustlance-user-service:latest
    container_name: user-service
    restart: unless-stopped
    depends_on:
      - mysql
      - kafka
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rcoem
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  marketplace-service:
    build:
      context: ./marketplace-service
      dockerfile: Dockerfile
    image: trustlance-marketplace-service:latest
    container_name: marketplace-service
    restart: unless-stopped
    depends_on:
      - mysql
      - kafka
      - redis
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/marketplace_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rcoem
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  contract-service:
    build:
      context: ./contract-service
      dockerfile: Dockerfile
    image: trustlance-contract-service:latest
    container_name: contract-service
    restart: unless-stopped
    depends_on:
      - mysql
      - kafka
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contract_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rcoem
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: trustlance-payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      - mysql
      - kafka
      - redis
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rcoem
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  escrow-service:
    build:
      context: ./escrow-service
      dockerfile: Dockerfile
    image: trustlance-escrow-service:latest
    container_name: escrow-service
    restart: unless-stopped
    depends_on:
      - mysql
      - kafka
      - redis
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/escrow_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rcoem
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    image: trustlance-review-service:latest
    container_name: review-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/review_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  dispute-service:
    build:
      context: ./dispute-service
      dockerfile: Dockerfile
    image: trustlance-dispute-service:latest
    container_name: dispute-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/dispute_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: trustlance-notification-service:latest
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/notification_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - trustlance-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: trustlance-ai-service:latest
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
      - minio
      - config-server
      - eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/ai_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    networks:
      - trustlance-network
